# Simplified from mullender/aliro-doorlock-esp32 deploy-installer.yml.
# Builds firmware in CI (PlatformIO) and publishes the four flash images
# (bootloader, partitions, boot_app0, firmware) alongside the installer UI.
# No GitHub Releases yet; installer/manifest.json ships as-is.

name: deploy-installer

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "firmware/**"
      - ".github/workflows/deploy-installer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-flight Pages deploys; the second event waits for the
# first to finish rather than half-publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          # `recursive` pulls installer/vendor/esp-web-tools and any of
          # its own submodules.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: installer/vendor/esp-web-tools/package-lock.json

      - name: Build vendored esp-web-tools
        working-directory: installer/vendor/esp-web-tools
        run: |
          npm ci --loglevel=error --no-progress
          bash script/build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Locate boot_app0.bin from framework
        id: boot_app0
        run: |
          set -euo pipefail
          path="$(find "$HOME/.platformio/packages" -name boot_app0.bin -print -quit)"
          echo "boot_app0.bin found at: $path"
          if [ -z "$path" ]; then
            echo "::error::boot_app0.bin not found under $HOME/.platformio/packages"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Prepare _site skeleton
        env:
          BOOT_APP0: ${{ steps.boot_app0.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p _site _site/js _site/vendor _site/vendor/dist

          cp installer/index.html _site/index.html
          cp installer/manifest.json _site/manifest.json

          # Built esp-web-tools output from the fork.
          cp -r installer/vendor/esp-web-tools/dist/web/* _site/vendor/dist/

          # Flash images from the firmware/ PlatformIO build.
          cp firmware/.pio/build/atoms3/bootloader.bin _site/bootloader.bin
          cp firmware/.pio/build/atoms3/partitions.bin _site/partitions.bin
          cp firmware/.pio/build/atoms3/firmware.bin   _site/firmware.bin
          cp "$BOOT_APP0" _site/boot_app0.bin

          # .nojekyll is important — the file names include hashes with
          # leading underscores that Jekyll would filter out silently.
          touch _site/.nojekyll

      - name: Dump _site contents for the run log
        run: |
          echo "==== _site tree ===="
          find _site -maxdepth 3 -print
          echo "==== manifest.json ===="
          cat _site/manifest.json || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
